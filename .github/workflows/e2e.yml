name: MegaBachatMart E2E & Production Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-integration-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test
      E2E_BASE_URL: http://127.0.0.1:3001
      JWT_SECRET: megabachatmart-ci-secret-key-2026
      RAZORPAY_WEBHOOK_SECRET: ci_mock_webhook_secret_key_2026
      PAYMENT_WEBHOOK_SECRET: ci_mock_webhook_secret_key_2026
      ADMIN_EMAIL: test@test.com
      NEXT_PUBLIC_ADMIN_PIN: MBM#Test001@2026
      ADMIN_PIN: MBM#Test001@2026

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Real Code Invariant Suite
        run: npm run test:real

      - name: Build Next.js Production Bundle
        run: npm run build

      - name: Run Playwright E2E Golden Path & Regression Suite
        run: npx playwright test

      - name: Upload Playwright Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
